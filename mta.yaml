_schema-version: 3.3.0
ID: CustomerComplaints
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: CustomerComplaints-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: CustomerComplaints-auth
      - name: CustomerComplaints-db
      - name: CustomerComplaints-destination

  - name: CustomerComplaints-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: CustomerComplaints-db

  - name: CustomerComplaints-app-deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: CustomerComplaints-html5-repo-host
        parameters:
          content-target: true
    build-parameters:
      build-result: resources/
      requires:
        - name: CustomerComplaintscustcomplaints
          artifacts:
            - custcomplaints.zip
          target-path: resources/

  - name: CustomerComplaintscustcomplaints
    type: html5
    path: app/custcomplaints
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms:
        []

  - name: CustomerComplaints-destinations
    type: com.sap.application.content
    requires:
      - name: CustomerComplaints-auth
        parameters:
          service-key:
            name: CustomerComplaints-auth-key
      - name: CustomerComplaints-html5-repo-host
        parameters:
          service-key:
            name: CustomerComplaints-html5-repo-host-key
      - name: srv-api
      - name: CustomerComplaints-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: CustomerComplaints-html5-repository
              ServiceInstanceName: CustomerComplaints-html5-repo-host
              ServiceKeyName: CustomerComplaints-html5-repo-host-key
              sap.cloud.service: CustomerComplaints.service
            - Name: CustomerComplaints-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: CustomerComplaints-auth
              ServiceKeyName: CustomerComplaints-auth-key
              sap.cloud.service: CustomerComplaints.service

resources:
  - name: CustomerComplaints-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: CustomerComplaints-${org}-${space}
        tenant-mode: dedicated
  - name: CustomerComplaints-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
  - name: CustomerComplaints-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: update
            destinations:
              - Name: CustomerComplaints-srv-api
                URL: ~{srv-api/srv-url}
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
                HTML5.ForwardAuthToken: true
                HTML5.DynamicDestination: true
              - Name: ui5
                URL: https://ui5.sap.com
                Authentication: NoAuthentication
                Type: HTTP
                ProxyType: Internet
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true

  - name: CustomerComplaints-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: CustomerComplaints-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
